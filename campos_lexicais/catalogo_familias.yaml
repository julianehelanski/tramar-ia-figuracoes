# Catálogo de famílias semânticas figurativas a rastrear na literatura de IA.
#
# Hierarquia: familia -> metadados.
# Metadados por família:
#   termos      lista de variantes em inglês (case-insensitive, word-boundary;
#               espaços tornam-se \s+ no script de codificação).
#   termos_pt   (rascunho) variantes em português, usadas quando o artigo está em
#               pt. RASCUNHO v0: traduções a validar por Juliane antes de codificar
#               qualquer corpus pt (decisão 2.c, idioma en+pt+es de 24/06/2026).
#   termos_es   (rascunho) variantes em espanhol, mesma ressalva de validação.
#   exclusoes   (opcional) expressões que, no trecho central casado ou nas 5
#               palavras adjacentes, descartam a ocorrência como ruído. Variantes
#               por língua em exclusoes_pt e exclusoes_es.
#   desambiguar (opcional, bool) marca família cujos termos exigem camada manual
#               de classificação (bruto vs. figurativo) em CSV auditável, no molde
#               da desambiguação war/wars do projeto Latour.
#   nota        nota analítica curta, usada nos relatórios.
#
# O script de codificação escolhe a lista de termos pela coluna `idioma` do artigo
# (en -> termos, pt -> termos_pt, es -> termos_es), com recuo para `termos` quando
# a lista da língua falta.
#
# Fonte da verdade para os scripts. A justificativa argumentativa fica em
# docs/decisoes_metodologicas.md. Catálogo aberto: revisado e expandido durante a
# codificação à medida que novas figurações emergem do material (registrar cada
# adição em docs/historico.md).

textil:
  termos: ["weave", "weaving", "woven", "network", "networks", "fabric", "thread",
           "threads", "knot", "knots", "fiber", "fibre", "mesh", "lace", "braid",
           "tapestry", "quilt", "crazy quilt", "patchwork", "seam", "seams",
           "stitch", "loom", "yarn", "string figure", "string figures"]
  termos_pt: ["tecer", "tece", "tecido", "tecida", "trama", "tramar", "urdir",
              "urdidura", "rede", "redes", "fio", "fios", "nó", "nós", "fibra",
              "fibras", "malha", "renda", "trança", "tapeçaria", "colcha", "retalho",
              "costura", "costurar", "ponto", "tear", "novelo", "figura de barbante"]
  termos_es: ["tejer", "teje", "tejido", "tejida", "trama", "urdir", "urdimbre",
              "red", "redes", "hilo", "hilos", "nudo", "nudos", "fibra", "fibras",
              "malla", "encaje", "trenza", "tapiz", "colcha", "retazo", "costura",
              "puntada", "telar", "hebra", "figura de hilo"]
  exclusoes: ["neural network", "neural networks", "deep network", "convolutional network"]
  exclusoes_pt: ["rede neural", "redes neurais", "rede neural profunda",
                 "rede convolucional"]
  exclusoes_es: ["red neuronal", "redes neuronales", "red neuronal profunda",
                 "red convolucional"]
  desambiguar: true
  nota: "Família-hipótese do projeto. 'network'/'rede'/'red' é o termo de fronteira:
    têxtil em Haraway, técnico-literal em IA. A exclusão remove os usos compostos
    com 'neural/deep/convolutional'; usos isolados exigem leitura. Cruzar com o
    catálogo têxtil de analise-figuracoes-latour."

